name: Sync Miraheze mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore mirror cache
        uses: actions/cache/restore@v4
        with:
          path: public
          key: mirror-${{ github.run_id }}
          restore-keys: |
            mirror-

      - name: Sync Miraheze
        run: |
          python -u scripts/sync_miraheze.py

      - name: Show generated files
        run: |
          find public -type f | wc -l
          du -sh public
          ls -lh public/index.html public/index.json public/sitemap.xml public/robots.txt

      - name: Save mirror cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public
          key: mirror-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
